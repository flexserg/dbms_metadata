# Edit host and TLS secret, then apply separately after the base resources.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata
  namespace: dbms-metadata
spec:
  ingressClassName: traefik
  tls:
    - hosts: [metadata.example.com]
      secretName: metadata-tls
  rules:
    - host: metadata.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metadata
                port:
                  number: 80
