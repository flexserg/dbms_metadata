apiVersion: v1
kind: ServiceAccount
metadata:
  name: metadata
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dbms-metadata-openbao-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-auth
    namespace: dbms-metadata
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
data:
  config.hcl: |
    ui = false
    disable_mlock = true
    api_addr = "https://openbao.dbms-metadata.svc:8200"
    cluster_addr = "https://openbao-0.openbao.dbms-metadata.svc:8201"
    storage "raft" {
      path = "/openbao/data"
      node_id = "openbao-0"
    }
    listener "tcp" {
      address = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file = "/openbao/tls/tls.key"
    }
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: metadata-openbao
  ports:
    - name: https
      port: 8200
    - name: cluster
      port: 8201
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: metadata-openbao
  template:
    metadata:
      labels:
        app: metadata-openbao
    spec:
      serviceAccountName: openbao-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:2.4.4
          args: ["server", "-config=/openbao/config/config.hcl"]
          env:
            - name: BAO_ADDR
              value: https://openbao.dbms-metadata.svc:8200
            - name: BAO_CACERT
              value: /openbao/ca/ca.crt
          ports:
            - containerPort: 8200
            - containerPort: 8201
          volumeMounts:
            - name: data
              mountPath: /openbao/data
            - name: config
              mountPath: /openbao/config
              readOnly: true
            - name: tls
              mountPath: /openbao/tls
              readOnly: true
            - name: ca
              mountPath: /openbao/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?standbyok=true
              port: 8200
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
              port: 8200
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: tls
          secret:
            secretName: openbao-tls
        - name: ca
          configMap:
            name: openbao-ca
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
